# Public template values only. Do not commit real route or D1 IDs.
name = "baby-log"
main = "src/worker.ts"
compatibility_date = "2026-04-24"
routes = [
  { pattern = "baby.example.com", custom_domain = true }
]

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/machine/*"]

[[d1_databases]]
binding = "DB"
database_name = "baby_log"
database_id = "replace-with-d1-database-id"
migrations_dir = "migrations"
